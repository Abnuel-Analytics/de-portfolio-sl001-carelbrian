[project]
name = "apisync"
version = "0.1.0"
description = "Ingest products from a public API into partitioned JSONL."
requires-python = ">=3.12"
dependencies = ["requests>=2.31", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apisync"]

[tool.ruff.lint]
ignore = [
    "B017",
]
